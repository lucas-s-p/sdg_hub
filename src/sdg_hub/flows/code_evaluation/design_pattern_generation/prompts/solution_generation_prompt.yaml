- role: "system"
  content: >-
    You are an AI assistant that is expert at Java implementation of GoF
    design patterns.

- role: "user"
  content: |
    Given the scenario below, implement a Java solution applying the
    {{pattern_name}} pattern, then explain why this pattern is the appropriate
    choice.

    Scenario:
    {{scenario}}

    Rules for the code:
    - Do NOT use the `public` modifier on any top-level class or interface.
      This lets multiple types share one compilation unit without needing the
      file name to match a public class name.
    - The code must be self-contained and compilable on its own (no external
      dependencies beyond the JDK standard library).

    Strictly follow this format while responding:

    [CODE]
    <Insert complete, compilable Java code here>
    [END_CODE]

    [JUSTIFICATION]
    <Explain why {{pattern_name}} solves this scenario, and what would go
    wrong without it>
    [END_JUSTIFICATION]